<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Flask App</title>
</head>
<body>
    <h1>Chat with FinanceGPT</h1>
    
    <form method="post">
        <label for="user_input">Enter your message:</label><br><br>
        <textarea id="user_input" name="user_input" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Send">
    </form>

    {% if user_input %}
        <h2>Your Input:</h2>
        <p>{{ user_input }}</p>
        
        <h2>ChatGPT Response:</h2>
        <p>{{ response }}</p>
    {% endif %}
</body>
</html>
